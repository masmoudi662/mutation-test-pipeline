name: ci

on:
  push:
  pull_request:

jobs:
  test-and-mutate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Java 8 for compiling/running this old repo (source=6)
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Read target (1 sample)
        run: |
          echo "Reading first row from targets/c2st-1.csv"
          LINE=$(tail -n +2 targets/c2st-1.csv | head -n 1)
          echo "LINE=$LINE"
          echo "ROW=$LINE" >> $GITHUB_ENV

      - name: Debug ROW
        run: |
          echo "ROW='${ROW}'"

      - name: Parse manifest row
        run: |
          IFS=',' read -r id repo_url commit_hash build_tool java_version test_framework class_path test_class_path focal_method <<< "${ROW}"
          echo "id=$id"
          echo "repo_url=$repo_url"
          echo "commit_hash=$commit_hash"
          echo "TARGET_ID=$id" >> $GITHUB_ENV
          echo "REPO_URL=$repo_url" >> $GITHUB_ENV
          echo "COMMIT_HASH=$commit_hash" >> $GITHUB_ENV

      - name: Clone target repository
        run: |
          git clone "$REPO_URL" target-repo
          cd target-repo
          git checkout "$COMMIT_HASH"

      - name: Run unit tests (Java 8)
        id: unit_tests
        continue-on-error: true
        run: |
          cd target-repo
          mvn -B test

      # 2) Still Java 8 here: install only needed modules so mysql/codec can resolve adbcj-api
      - name: Install deps for mysql/codec (Java 8)
        if: steps.unit_tests.outcome == 'success'
        run: |
          cd target-repo
          mvn -B -pl api,mysql/codec -am -DskipTests install

      # 3) Switch to Java 17 ONLY for PIT (PIT plugin requires newer Java)
      - name: Switch to Java 17 for PIT
        if: steps.unit_tests.outcome == 'success'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 4) Run PIT only in mysql/codec module
      - name: Run PIT (mysql/codec only)
        if: steps.unit_tests.outcome == 'success'
        id: pitest
        continue-on-error: true
        run: |
          cd target-repo/mysql/codec
          mvn -B test
          mvn -B org.pitest:pitest-maven:mutationCoverage