name: ci

on:
  push:
  pull_request:

jobs:
  test-and-mutate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Java 8 for build/tests
      - name: Set up Java 8 (for tests/build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Read target (1 sample)
        run: |
          LINE=$(tail -n +2 targets/c2st-1.csv | head -n 1)
          echo "ROW=$LINE" >> $GITHUB_ENV

      - name: Parse manifest row
        run: |
          IFS=',' read -r id repo_url commit_hash build_tool java_version test_framework class_path test_class_path focal_method <<< "${ROW}"

          echo "TARGET_ID=$id" >> $GITHUB_ENV
          echo "REPO_URL=$repo_url" >> $GITHUB_ENV
          echo "COMMIT_HASH=$commit_hash" >> $GITHUB_ENV
          echo "TEST_FRAMEWORK=$test_framework" >> $GITHUB_ENV
          echo "CLASS_PATH=$class_path" >> $GITHUB_ENV
          echo "TEST_CLASS_PATH=$test_class_path" >> $GITHUB_ENV

      - name: Clone target repository
        run: |
          git clone "$REPO_URL" target-repo
          cd target-repo
          git checkout "$COMMIT_HASH"

      - name: Find module for focal class
        run: |
          cd target-repo
          chmod +x ../scripts/find_module.sh
          export CLASS_PATH="${CLASS_PATH}"
          export TEST_CLASS_PATH="${TEST_CLASS_PATH}"
          ../scripts/find_module.sh

      - name: Build full project (reactor install)
        id: full_build
        run: |
          cd target-repo
          mvn -B -DskipTests install

      # DEBUG BEFORE TESTS
      - name: Debug module vars (before tests)
        run: |
          echo "MODULE_POM=$MODULE_POM"
          echo "MODULE_DIR=$MODULE_DIR"
          echo "TEST_DIR=$TEST_DIR"
          echo "CLASS_PATH=$CLASS_PATH"
          echo "TEST_CLASS_PATH=$TEST_CLASS_PATH"
          ls -la target-repo || true
          if [ -n "$MODULE_DIR" ]; then ls -la "target-repo/$MODULE_DIR" || true; fi
          if [ -n "$TEST_DIR" ]; then ls -la "target-repo/$TEST_DIR" || true; fi
          if [ -n "$MODULE_POM" ]; then ls -la "target-repo/$MODULE_POM" || true; fi

      - name: Run original tests (module-scoped)
        id: unit_tests
        run: |
          cd target-repo
          mvn -B -f "$MODULE_POM" test \
            -Dmaven.test.skip=false \
            -DskipTests=false \
            -Dsurefire.skipTests=false

      - name: Verify tests actually ran
        run: |
          cd target-repo
          if ! find . -maxdepth 5 -type d -name "surefire-reports" | grep -q .; then
            echo "No surefire-reports found. Tests were skipped or none exist."
            exit 1
          fi

      # Switch to Java 17 for PIT
      - name: Set up Java 17 (for PIT)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Decide PIT eligibility
        run: |
          TF="$(echo "${TEST_FRAMEWORK}" | tr '[:upper:]' '[:lower:]')"
          if echo "$TF" | grep -Eq 'junit'; then
            echo "PIT_ELIGIBLE=true" >> $GITHUB_ENV
          else
            echo "PIT_ELIGIBLE=false" >> $GITHUB_ENV
          fi

      - name: Run PIT baseline
        if: env.PIT_ELIGIBLE == 'true'
        run: |
          cd target-repo
          mvn -B -f "$MODULE_POM" org.pitest:pitest-maven:mutationCoverage
          python3 ../scripts/parse_pit.py
          cat artifacts/pit_baseline.json

      - name: Upload PIT reports
        if: env.PIT_ELIGIBLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pit-reports
          path: target-repo/**/target/pit-reports/**
          if-no-files-found: warn